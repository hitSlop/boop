[package]
name = "boop"
version = "0.1.0"
edition = "2024"
description = "Local-first remote iOS & Rust builds and Firebase OTA publishing for coding agents"
license = "MIT"
repository = "https://github.com/hitSlop/boop"
homepage = "https://github.com/hitSlop/boop"
readme = "README.md"

[[bin]]
name = "boop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
plist = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1.11", features = ["v4"] }

tempfile = "3.14"
