<svg viewBox="0 0 780 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Boop architecture diagram: Local Mac worktrees sync to Boat Linux forks running xtool 2.0, return unsigned .app bundles for local Metal, actool, and Keychain codesigning, then deploy to iPhone or Firebase App Distribution.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#231c2e" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b5ce7" />
    </marker>
  </defs>
  <rect x="10" y="34" width="165" height="162" rx="14" fill="#fffdf8" stroke="#231c2e" stroke-width="1.8" />
  <text x="92" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#6b5ce7">LOCAL MAC</text>
  <text x="92" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#231c2e">Git Worktrees</text>
  <text x="92" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5e556a">Agent A · Agent B</text>
  <text x="92" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5e556a">boop build / run</text>
  <text x="92" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5e556a">boop publish</text>
  <text x="92" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5e556a">&lt;50 MB RAM</text>

  <rect x="215" y="34" width="175" height="162" rx="14" fill="#16141d" stroke="#231c2e" stroke-width="1.8" />
  <text x="302" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#f7e987">BOAT LINUX FORKS</text>
  <text x="302" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fffdf8">xtool 2.0 + Swift 6.4</text>
  <text x="302" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c7c1d4">1 isolated fork / worktree</text>
  <text x="302" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c7c1d4">Warm DerivedData + SPM</text>
  <text x="302" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#c7c1d4">No Apple signing keys</text>
  <text x="302" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#9a91ad">$0.036/hr · 17–30s edit</text>

  <rect x="430" y="34" width="165" height="162" rx="14" fill="#fcf5cc" stroke="#231c2e" stroke-width="1.8" />
  <text x="512" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#231c2e">LOCAL FINISH (~5s)</text>
  <text x="512" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#231c2e">Overlay &amp; Sign</text>
  <text x="512" y="112" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#463d52">Cached xcrun metal</text>
  <text x="512" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#463d52">Cached xcrun actool</text>
  <text x="512" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#463d52">Keychain codesign</text>
  <text x="512" y="178" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#463d52">Ad Hoc / Dev · .ipa</text>

  <rect x="630" y="24" width="140" height="80" rx="12" fill="#fffdf8" stroke="#231c2e" stroke-width="1.8" />
  <text x="700" y="54" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#231c2e">iPhone / Sim</text>
  <text x="700" y="75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5e556a">devicectl / simctl</text>
  <text x="700" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b5ce7">boop run --device</text>

  <rect x="630" y="126" width="140" height="82" rx="12" fill="#fffdf8" stroke="#6b5ce7" stroke-width="2" />
  <text x="700" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#231c2e">Build Inbox</text>
  <text x="700" y="176" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5e556a">Firebase OTA .ipa</text>
  <text x="700" y="194" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b5ce7">boop publish</text>

  <line x1="175" y1="95" x2="212" y2="95" stroke="#231c2e" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="193" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5e556a">rsync</text>
  <line x1="390" y1="115" x2="427" y2="115" stroke="#231c2e" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="408" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5e556a">.app</text>
  <line x1="595" y1="88" x2="627" y2="68" stroke="#231c2e" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="595" y1="142" x2="627" y2="164" stroke="#6b5ce7" stroke-width="1.8" marker-end="url(#arrow-violet)" />
</svg>
